[package]
name = "turul-ai-catalog-trust"
description = "Signed payloads, artifact digests and signing for AI Catalog trust"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
rust-version.workspace = true
publish = true
readme = "README.md"
categories = ["cryptography", "authentication", "web-programming"]
documentation = "https://docs.rs/turul-ai-catalog-trust"
exclude = ["tests/fixtures"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
registration = ["dep:turul-ai-catalog-storage", "dep:async-trait", "dep:tokio"]

[dependencies]
turul-ai-catalog = { workspace = true }
turul-ai-catalog-client = { workspace = true }
sha2.workspace = true
turul-jwt-validator.workspace = true
turul-ai-catalog-storage = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }
ai-catalog-trust.workspace = true
ai-catalog.workspace = true
ai-catalog-validate.workspace = true
