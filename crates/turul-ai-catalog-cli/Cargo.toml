[package]
name = "turul-ai-catalog-cli"
description = "Command line for AI Catalog: validate, list, view, init, add, remove and store"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
rust-version.workspace = true
publish = true
readme = "README.md"
documentation = "https://docs.rs/turul-ai-catalog-cli"
categories = ["command-line-utilities", "web-programming"]
exclude = ["tests/fixtures"]

[[bin]]
name = "turul-ai-catalog"
path = "src/main.rs"
doc = false

[features]
# Backends for `store`; SQLite is always built.
postgres = ["turul-ai-catalog-storage/postgres"]
ssm = ["turul-ai-catalog-trust/ssm", "dep:aws-config", "dep:aws-sdk-ssm"]
dynamodb = ["dep:aws-config", "dep:aws-sdk-dynamodb", "turul-ai-catalog-storage/dynamodb"]

[dependencies]
turul-ai-catalog = { workspace = true }
turul-ai-catalog-storage = { workspace = true, features = ["sqlite"] }
turul-ai-catalog-client = { workspace = true }
turul-ai-catalog-trust = { workspace = true }
turul-ai-catalog-tui = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
aws-config = { workspace = true, optional = true }
aws-sdk-dynamodb = { workspace = true, optional = true }
aws-sdk-ssm = { workspace = true, optional = true }
