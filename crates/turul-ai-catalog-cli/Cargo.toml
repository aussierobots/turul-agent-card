exclude = ["tests/fixtures"]

[[bin]]
name = "turul-ai-catalog"
path = "src/main.rs"
doc = false

[dependencies]
turul-ai-catalog = { workspace = true }
turul-ai-catalog-client = { workspace = true }
turul-ai-catalog-tui = { workspace = true }
clap = { workspace = true }
