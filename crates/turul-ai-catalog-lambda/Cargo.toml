[package]
name = "turul-ai-catalog-lambda"
description = "AWS Lambda handler serving an AI Catalog assembled from a catalog store at the well-known URI"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
rust-version.workspace = true
publish = true
readme = "README.md"
documentation = "https://docs.rs/turul-ai-catalog-lambda"
categories = ["web-programming", "network-programming"]

[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "turul-ai-catalog-lambda"
path = "src/main.rs"
doc = false

# Local development server: `cargo run -p turul-ai-catalog-lambda --features local --bin turul-ai-catalog-serve`.
[[bin]]
name = "turul-ai-catalog-serve"
path = "src/bin/serve.rs"
doc = false
required-features = ["local"]

[features]
local = ["dep:axum", "tokio/net", "tokio/signal"]
dynamodb = ["dep:aws-config", "dep:aws-sdk-dynamodb", "turul-ai-catalog-storage/dynamodb"]

[dependencies]
turul-ai-catalog = { workspace = true }
turul-ai-catalog-storage = { workspace = true }
lambda_http = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
aws-sdk-dynamodb = { workspace = true, optional = true }

[dev-dependencies]
futures = { workspace = true }
async-trait = { workspace = true }
turul-ai-catalog-client = { workspace = true }
ai-catalog = { workspace = true }
ai-catalog-validate = { workspace = true }
